[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "art-factory"
version = "0.1.0"
description = "Von der Idee zum Bild: Entfaltung, Prompting, Erzeugung und QS"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
api = ["anthropic", "google-genai"]
dev = ["pytest"]

[project.scripts]
art-factory = "art_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
